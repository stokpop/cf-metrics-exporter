---
name: Build
run-name: Build ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      - '.mvn/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set tag name
        run: |
          echo "TAG_NAME=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Maven build
        run: ./mvnw clean package

      - name: Upload java agent jar to github actions build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cf-metrics-exporter-${{ env.TAG_NAME }}-${{ github.run_id }}.jar
          path: target/cf-metrics-exporter-${{ env.TAG_NAME }}.jar

